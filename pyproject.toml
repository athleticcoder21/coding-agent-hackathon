[project]
name = "gemma-4-developer-agent"
version = "0.1.0"
description = "Kaggle Gemma 4 Developer Agent harness and LoRA training workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
  "kaggle>=2,<3",
  "protobuf>=5,<7",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.0,<2",
  "bitsandbytes>=0.46,<1",
  "datasets>=3,<5",
  "peft>=0.17,<1",
  "safetensors>=0.5,<1",
  "torch>=2.7,<3",
  "transformers>=5.0,<6",
]

[tool.uv]
package = false
