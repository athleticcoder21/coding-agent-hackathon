agent_class: LlmAgent
name: gemma_coder
model: gemma-4-31b-it-qat-w4a16-ct
description: Repairs Python repositories from issue reports.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
